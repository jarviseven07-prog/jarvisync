name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Windows-only on purpose: the launcher, the verified-update flow and the
    # desktop shell are PowerShell and Windows-specific.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Test
        run: npm test
