name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Both supported platforms run the suite. The launcher, the verified-update
    # flow and the desktop shell are PowerShell and Windows-specific, and each
    # platform skips the other's cases, so neither run covers the other.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Test
        run: npm test
